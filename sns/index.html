<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>インスタ投稿メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --ink:#23251F; --muted:#6B6F66;
  --line:#D5D8D0; --moss:#3F4A3A; --moss-soft:#E1E6DC; --warn:#8A5A2B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 14px}
h1{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:22px;margin:0;letter-spacing:.04em}
.icon-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;color:var(--ink)}
.current{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--moss);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.current b{font-size:17px}
.current small{display:block;opacity:.8;font-size:13px}
.current button{background:#fff;color:var(--moss);border:none;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;white-space:nowrap}
section{background:var(--surface);border-radius:14px;padding:20px 18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 4px;font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.photos{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:10px}
.slot{position:relative;aspect-ratio:4/5;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:#F7F8F5;color:var(--muted);font-size:13px;line-height:1.5;padding:6px}
.slot b{color:var(--ink);font-size:15px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.slot .clear{position:absolute;top:6px;right:6px;z-index:2;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:999px;width:28px;height:28px;font-size:16px;line-height:28px;padding:0;display:none}
.slot.has .clear{display:block}
.pattern-note{margin:14px 0 0;padding:10px 12px;border-radius:8px;font-size:14px;background:var(--moss-soft)}
.pattern-note.b{background:#F3E9DC;color:var(--warn)}
label.f{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
input[type=text],input[type=url],input[type=password],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:72px}
.primary{display:block;width:100%;margin-top:18px;padding:15px;border:none;border-radius:12px;background:var(--moss);color:#fff;font:inherit;font-size:17px;font-weight:700}
.primary:disabled{opacity:.55}
.secondary{padding:10px 16px;border:1px solid var(--moss);border-radius:10px;background:#fff;color:var(--moss);font:inherit;font-size:15px;font-weight:500}
.error{color:#A33;font-size:14px;margin-top:10px;white-space:pre-wrap}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.slides img{flex:0 0 78%;max-width:78%;scroll-snap-align:center;border-radius:8px;aspect-ratio:4/5;object-fit:cover}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.range{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:10px;margin-top:10px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--moss)}
details{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
summary{font-weight:500;cursor:pointer}
.count{font-size:12px;color:var(--muted);text-align:right}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
dialog{border:none;border-radius:16px;padding:22px 18px;width:min(92vw,520px);max-height:88vh;overflow:auto;color:var(--ink)}
dialog::backdrop{background:rgba(20,22,18,.5)}
.pcard{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;width:100%;text-align:left;background:#F7F8F5;border:2px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;font:inherit;color:var(--ink)}
.pcard.on{border-color:var(--moss);background:var(--moss-soft)}
.pcard b{display:block;font-size:17px;margin-bottom:2px}
.pcard span{display:block;font-size:13px;color:var(--muted);line-height:1.6}
.thumb{aspect-ratio:4/5;border-radius:8px;position:relative;overflow:hidden}
.thumb.menu{background:linear-gradient(160deg,#7A5240,#3E2A20)}
.thumb.menu i{position:absolute;left:10px;top:18%;font-family:"Shippori Mincho B1",serif;font-style:normal;font-weight:700;color:#fff;font-size:17px;line-height:1.25}
.thumb.menu i::first-letter{color:#D8BE96}
.thumb.menu em{position:absolute;left:0;top:76%;width:78%;height:16px;background:rgba(66,50,40,.7)}
.thumb.worry{background:#F1EFEB}
.thumb.worry i{position:absolute;left:10px;top:12px;font-family:"Shippori Mincho B1",serif;font-style:normal;font-weight:700;color:#2E2B27;font-size:10px;line-height:1.4;white-space:nowrap}
.thumb.worry em{position:absolute;left:10px;width:58px;height:5px;background:#BDB6AD;border-radius:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>インスタ投稿メーカー</h1>
    <button class="icon-btn" id="openSettings">設定</button>
  </header>

  <div class="current">
    <div><small>投稿パターン</small><b id="currentName">未選択</b></div>
    <button id="openPattern">パターンを変える</button>
  </div>

  <section>
    <h2>1. 写真を選ぶ</h2>
    <p class="hint" id="photoHint"></p>
    <div class="photos" id="photos"></div>
    <p class="pattern-note" id="patternNote"></p>
  </section>

  <section>
    <h2>2. ひと言メモ</h2>
    <p class="hint">空欄でも写真から読み取って作ります。書くほど自然な文章になります。</p>
    <div id="memo"></div>
    <button class="primary" id="generate">投稿を作る</button>
    <div class="error" id="error"></div>
  </section>

  <section id="result" hidden>
    <h2>3. できあがり</h2>
    <p class="hint">横にスワイプして確認できます。画像は長押しでも保存できます。</p>
    <div class="slides" id="slides"></div>
    <button class="primary" id="saveImages">画像をまとめて保存</button>

    <div class="range"><span>明るさ</span><input type="range" id="bright" min="-20" max="20" value="4"></div>
    <div class="range"><span>あたたかさ</span><input type="range" id="warm" min="-10" max="10" value="2"></div>

    <label class="f" for="caption">キャプション</label>
    <textarea id="caption" style="min-height:240px"></textarea>
    <div class="count" id="captionCount"></div>
    <label class="f" for="hashtags">ハッシュタグ</label>
    <textarea id="hashtags" style="min-height:140px"></textarea>
    <div class="row">
      <button class="secondary" id="copyAll">本文＋タグをコピー</button>
      <button class="secondary" id="copyCaption">本文だけコピー</button>
    </div>

    <details>
      <summary>画像の文字を直す</summary>
      <div id="editFields"></div>
    </details>
  </section>
</div>

<dialog id="patternDlg">
  <h2>どのパターンで作りますか？</h2>
  <p class="hint">あとから上のボタンで変えられます。</p>
  <button class="pcard" data-p="menu">
    <div class="thumb menu"><i>秋の<br>艶髪の<br>作り方</i><em></em></div>
    <div><b>メニュー紹介</b><span>写真全面に明朝体のタイトルと帯を重ねる3枚構成。季節のおすすめやメニューの良さを伝える投稿に。写真は1〜3枚。</span></div>
  </button>
  <button class="pcard" data-p="worry">
    <div class="thumb worry"><i>こんなお悩み<br>ありませんか？</i><em style="top:58px"></em><em style="top:72px"></em><em style="top:86px"></em></div>
    <div><b>お悩み解決</b><span>お悩み → 原因と必要なこと → 仕上がりの流れで予約につなげる構成。Before／After の2枚がおすすめ（After だけでも作れます）。</span></div>
  </button>
</dialog>

<dialog id="settings">
  <h2>設定</h2>
  <p class="hint">この端末に保存されます。</p>
  <label class="f" for="sGas">GASのURL</label>
  <input type="url" id="sGas" placeholder="https://script.google.com/macros/s/.../exec">
  <label class="f" for="sPass">合言葉（GASで設定した場合のみ）</label>
  <input type="password" id="sPass">
  <label class="f" for="sSalon">サロン名（お悩み解決の表紙右下に入ります）</label>
  <input type="text" id="sSalon" placeholder="例：Dulce">
  <label class="f" for="sStaff">スタッフ名</label>
  <input type="text" id="sStaff" placeholder="例：tomo">
  <label class="f" for="sArea">エリア</label>
  <input type="text" id="sArea" placeholder="例：札幌 円山">
  <label class="f" for="sTags">必ず入れるハッシュタグ</label>
  <input type="text" id="sTags" placeholder="例：#札幌美容室 #札幌髪質改善">
  <label class="f" for="sCta">キャプション最後の予約案内</label>
  <textarea id="sCta" placeholder="例：ご予約・ご相談はプロフィールのリンクからどうぞ"></textarea>
  <button class="primary" id="saveSettings">保存する</button>
</dialog>

<div class="toast" id="toast"></div>

<script>
window.DEMO = {
  id: "sns", app: "SNS投稿管理",
  pain: "インスタを更新したいけれど、文章を考える時間がない。何を書けば予約につながるのかわからない。",
  steps: [
    { t: "投稿パターンを選ぶ", d: "「メニュー紹介」か「お悩み解決」を選びます。上のボタンでいつでも変えられます。" },
    { t: "「📷 見本の写真とメモを入れる」を押す", d: "実際は施術写真を選ぶだけ。ひと言メモは空欄でも、写真から読み取って作ります。" },
    { t: "「投稿を作る」を押す", d: "本番ではAIが20〜40秒で、画像の文字・キャプション・ハッシュタグをまとめて作ります。" },
    { t: "できあがりを確認してコピー・保存", d: "画像は横にスワイプして確認。文字の手直しや明るさの調整もできます。" }
  ],
  reset: function () { try { localStorage.removeItem("lumi.instaMakerSettings"); } catch (e) {} },
  onClose: function () { if (typeof state !== "undefined" && !state.pattern) openPattern(); }
};
</script>
<script src="../common/demo-kit.js"></script>
<script>
/* ========== 基本設定 ========== */
const W = 1080, H = 1350;
const MIN = '"Shippori Mincho B1", "Hiragino Mincho ProN", serif';
const SERIF_EN = '"Cormorant Garamond", serif';
const SCRIPT = '"Pinyon Script", "Cormorant Garamond", serif';
const PAPER = 'rgba(248,247,244,0.95)';
const DARK = '#2E2B27';
const TAUPE = '#8C8278';
const GOLD = '#D8BE96';
const $ = id => document.getElementById(id);

const PATTERNS = {
  menu: {
    name: 'メニュー紹介',
    hint: '1枚目の写真は必須です。2枚目・3枚目用の写真がなければ、1枚目の写真を切り抜き方を変えて使います。',
    cols: 3, required: 'p1',
    slots: [['p1', '写真1', '表紙用（必須）'], ['p2', '写真2', '解説用（任意）'], ['p3', '写真3', 'おすすめ用（任意）']],
    memo: [['theme', 'テーマ・季節', '例：秋の艶髪'], ['menu', 'メニュー', '例：プレトワカラー＋トリートメント'], ['note', '伝えたいこと（任意）', '例：ブラウンや暖色を少し入れると艶っぽく見える。くせが気になる方には髪質改善ストレート']]
  },
  worry: {
    name: 'お悩み解決',
    hint: 'Before と After の2枚がおすすめです。After だけでも作れます。',
    cols: 2, required: 'after',
    slots: [['before', 'Before', '施術前（任意）'], ['after', 'After', '仕上がり（必須）']],
    memo: [['worry', 'お客様の悩み', '例：朝、毛先がはねて広がる。ボブにすると子どもっぽくなるのが不安'], ['menu', 'メニュー', '例：カット＋髪質改善ストレート'], ['note', '補足（任意）', '例：乾かすだけでまとまるように内側を軽くした']]
  }
};

const state = { pattern: null, photos: {}, prepared: {}, data: null, files: [] };

/* ========== 設定 ========== */
const SKEY = 'lumi.instaMakerSettings';
function getSettings() { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } }
function fillSettings() {
  const s = getSettings();
  $('sGas').value = s.gas || ''; $('sPass').value = s.pass || ''; $('sSalon').value = s.salon || '';
  $('sStaff').value = s.staff || ''; $('sArea').value = s.area || '札幌'; $('sTags').value = s.tags || '';
  $('sCta').value = s.cta || 'ご予約・ご相談はプロフィールのリンクからどうぞ';
}
$('openSettings').onclick = () => { fillSettings(); $('settings').showModal(); };
$('saveSettings').onclick = () => {
  const s = Object.assign(getSettings(), { gas: $('sGas').value.trim(), pass: $('sPass').value, salon: $('sSalon').value.trim(),
    staff: $('sStaff').value.trim(), area: $('sArea').value.trim(), tags: $('sTags').value.trim(), cta: $('sCta').value.trim() });
  try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {}
  $('settings').close(); toast('設定を保存しました');
  if (!state.pattern) openPattern();
  else if (state.data) renderAll();
};

/* ========== パターン選択 ========== */
function openPattern() {
  document.querySelectorAll('.pcard').forEach(b => b.classList.toggle('on', b.dataset.p === state.pattern));
  $('patternDlg').showModal();
}
$('openPattern').onclick = openPattern;
$('patternDlg').addEventListener('cancel', e => { if (!state.pattern) e.preventDefault(); });
document.querySelectorAll('.pcard').forEach(btn => {
  btn.onclick = () => { $('patternDlg').close(); setPattern(btn.dataset.p); };
});
function setPattern(p) {
  if (state.pattern === p && $('photos').children.length) return;
  if (state.pattern !== p) {
    state.pattern = p; state.photos = {}; state.prepared = {}; state.data = null; state.files = [];
    $('result').hidden = true; $('error').textContent = '';
  }
  const def = PATTERNS[p];
  $('currentName').textContent = def.name;
  $('photoHint').textContent = def.hint;
  const box = $('photos'); box.style.setProperty('--cols', def.cols); box.innerHTML = '';
  def.slots.forEach(([k, title, sub]) => {
    const d = document.createElement('div'); d.className = 'slot'; d.id = 'slot-' + k;
    d.innerHTML = `<button class="clear" aria-label="${title}を外す">×</button><b>${title}</b>${sub}<input type="file" accept="image/*">`;
    d.querySelector('input').addEventListener('change', e => onPhoto(k, e.target.files[0]));
    d.querySelector('.clear').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); onPhoto(k, null); });
    box.appendChild(d);
  });
  const memo = $('memo'); memo.innerHTML = '';
  def.memo.forEach(([id, label, ph]) => {
    const l = document.createElement('label'); l.className = 'f'; l.htmlFor = 'memo-' + id; l.textContent = label;
    const isShort = id === 'menu' || id === 'theme';
    const el = document.createElement(isShort ? 'input' : 'textarea');
    if (isShort) el.type = 'text';
    el.id = 'memo-' + id; el.placeholder = ph;
    memo.appendChild(l); memo.appendChild(el);
  });
  try { const s = getSettings(); s.lastPattern = p; localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {}
  updateNote();
}

/* ========== 写真の選択 ========== */
async function onPhoto(k, file) {
  const slot = $('slot-' + k);
  slot.querySelectorAll('img').forEach(n => n.remove());
  if (!file) {
    delete state.photos[k]; delete state.prepared[k];
    slot.querySelector('input').value = ''; slot.classList.remove('has');
  } else {
    const img = await loadImage(file);
    state.photos[k] = img; delete state.prepared[k];
    const prev = document.createElement('img'); prev.src = img.src; prev.alt = '';
    slot.insertBefore(prev, slot.querySelector('input'));
    slot.classList.add('has');
  }
  updateNote();
  if (state.data && state.photos[PATTERNS[state.pattern].required]) {
    if (state.pattern === 'worry') buildEditFields();
    renderAll();
  }
}
function loadImage(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
}
function apiPattern() {
  if (state.pattern === 'menu') return 'menu';
  return state.photos.before && state.photos.after ? 'worryA' : 'worryB';
}
function updateNote() {
  const n = $('patternNote'), p = state.pattern;
  if (!p) { n.textContent = ''; return; }
  if (p === 'menu') {
    n.className = 'pattern-note';
    if (!state.photos.p1) { n.textContent = '写真1を選んでください。'; return; }
    const extra = ['p2', 'p3'].filter(k => state.photos[k]).length;
    n.textContent = extra === 2 ? '3枚それぞれの写真で作ります。' : '3枚構成で作ります。足りない分は写真1を使います。';
    return;
  }
  if (!state.photos.after) { n.className = 'pattern-note'; n.textContent = 'After写真を選んでください。'; return; }
  if (apiPattern() === 'worryA') { n.className = 'pattern-note'; n.textContent = 'Before／After の5枚構成で作ります。'; }
  else { n.className = 'pattern-note b'; n.textContent = 'After写真1枚の4枚構成で作ります。比較がないぶん説得力は少し下がるので、Before写真があれば追加するのがおすすめです。'; }
}

/* ========== AIに依頼 ========== */
function toJpegBase64(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q).split(',')[1];
}
function memoVal(id) { const el = $('memo-' + id); return el ? el.value.trim() : ''; }
$('generate').onclick = async () => {
  $('error').textContent = '';
  const s = getSettings();
  if (!s.gas) { fillSettings(); $('settings').showModal(); return; }
  if (!state.pattern) { openPattern(); return; }
  const def = PATTERNS[state.pattern];
  if (!state.photos[def.required]) { $('error').textContent = (state.pattern === 'menu' ? '写真1' : 'After写真') + 'を選んでください。'; return; }
  const btn = $('generate'); btn.disabled = true; btn.textContent = '作成中…（20〜40秒ほど）';
  try {
    const ap = apiPattern();
    const images = [];
    if (state.pattern === 'menu') {
      [['p1', '写真1（表紙用）'], ['p2', '写真2（解説用）'], ['p3', '写真3（おすすめ用）']].forEach(([k, label]) => {
        if (state.photos[k]) images.push({ label: '【' + label + '】', data: toJpegBase64(state.photos[k], 1024, 0.82) });
      });
    } else {
      if (ap === 'worryA') images.push({ label: '【Before写真（施術前）】', data: toJpegBase64(state.photos.before, 1024, 0.82) });
      images.push({ label: '【After写真（仕上がり）】', data: toJpegBase64(state.photos.after, 1024, 0.82) });
    }
    const body = { pattern: ap, images, passcode: s.pass || '', salonName: s.salon, staffName: s.staff, area: s.area,
      fixedTags: s.tags, cta: s.cta, theme: memoVal('theme'), worry: memoVal('worry'), menu: memoVal('menu'), note: memoVal('note') };
    const res = await fetch(s.gas, { method: 'POST', body: JSON.stringify(body) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '作成に失敗しました。');
    state.data = state.pattern === 'menu' ? normalizeMenu(json.data) : normalizeWorry(json.data);
    $('caption').value = state.data.caption;
    $('hashtags').value = state.data.hashtags.join('\n');
    updateCount();
    buildEditFields();
    $('result').hidden = false;
    await renderAll();
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {

      document.fonts.load(`700 60px ${MIN}`, all),
      document.fonts.load(`500 40px ${MIN}`, all),
      document.fonts.load(`italic 500 60px ${SERIF_EN}`, 'BeforeAfter'),
      document.fonts.load(`60px ${SCRIPT}`, (D.cover && D.cover.accent) || 'Autumn')
    ]);
  } catch (e) {}
}
let rendering = false, again = false;
async function renderAll() {
  if (!state.data || !state.photos[PATTERNS[state.pattern].required]) return;
  if (rendering) { again = true; return; }
  rendering = true;
  try {
    const D = state.data, S = getSettings();
    await ensureFonts(D);
    let list;
    if (state.pattern === 'menu') list = [c => slideMenuCover(c, D), c => slideMenuDetail(c, D), c => slideMenuAppeal(c, D)];
    else if (apiPattern() === 'worryA') list = [c => slideWorryCover(c, D, S), c => slideWorries(c, D, true), c => slideCauseA(c, D), c => slideSolutionA(c, D), c => slideResultA(c, D)];
    else list = [c => slideWorryCover(c, D, S), c => slideWorries(c, D, false), c => slideCauseSolutionB(c, D), c => slideResultB(c, D)];
    const box = $('slides'); box.innerHTML = '';
    const files = [];
    for (let i = 0; i < list.length; i++) {
      const { c, x } = mk(W, H);
      list[i](x);
      const url = c.toDataURL('image/jpeg', 0.92);
      const img = document.createElement('img'); img.src = url; img.alt = `${i + 1}枚目`;
      box.appendChild(img);
      const blob = await (await fetch(url)).blob();
      files.push(new File([blob], `post_${i + 1}.jpg`, { type: 'image/jpeg' }));
    }
    state.files = files;
  } finally {
    rendering = false;
    if (again) { again = false; renderAll(); }
  }
}

/* ========== 保存・コピー ========== */
$('saveImages').onclick = async () => {
  const files = state.files; if (!files.length) return;
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); } catch (e) {}
  } else {
    files.forEach(f => { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); });
    toast('画像をダウンロードしました');
  }
};
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('コピーしました');
}
$('copyAll').onclick = () => copyText($('caption').value.trim() + '\n\n' + $('hashtags').value.trim());
$('copyCaption').onclick = () => copyText($('caption').value.trim());
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800); }

const _realFetch = window.fetch.bind(window);
window.fetch = function (url, opt) {

/* ---------- 見本の写真（架空のイメージ画像を自動で描きます） ---------- */
function drawSampleHair(kind) {
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const tones = {
    caramel: ['#efe2d3', '#d9b99a', '#7a4a2c', '#b77a4c', '#e6c39a'],
    ash:     ['#e8e5e1', '#c9c1b8', '#4f4842', '#8c8076', '#d6cbbf'],
    pink:    ['#f1e2df', '#dcb6ad', '#6e3b36', '#a8645a', '#e6b8ab'],
    before:  ['#e7e2da', '#c8bfb2', '#5a4636', '#8a6c52', '#b49a80'],
    after:   ['#efe4d6', '#d8bea3', '#5e3a24', '#a46a42', '#f0d0a8']
  }[kind];
  let sd = { caramel: 7, ash: 13, pink: 21, before: 33, after: 47 }[kind];
  const r = () => { sd = (sd * 9301 + 49297) % 233280; return sd / 233280; };
  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, tones[0]); bg.addColorStop(1, tones[1]);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 14; i++) { // 背景のぼけ
    const x = r() * W, y = r() * H * 0.6, rad = 40 + r() * 120;
    const rg = g.createRadialGradient(x, y, 0, x, y, rad); rg.addColorStop(0, 'rgba(255,255,255,.35)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
  }
  const messy = kind === 'before';
  const N = 520;
  for (let i = 0; i < N; i++) { // 髪の流れ
    const t = i / N, x0 = W * (0.12 + 0.76 * t) + (r() - 0.5) * 30;
    const sway = messy ? 160 : 60;
    const hg = g.createLinearGradient(0, 200, 0, H);
    hg.addColorStop(0, tones[2]); hg.addColorStop(0.55, tones[3]); hg.addColorStop(1, tones[messy ? 3 : 4]);
    g.strokeStyle = hg; g.globalAlpha = 0.18 + r() * 0.25; g.lineWidth = 2 + r() * 4;
    g.beginPath(); g.moveTo(W * 0.5 + (x0 - W * 0.5) * 0.35, 120 + r() * 40);
    const endX = x0 + (r() - 0.5) * sway + (messy ? (t - 0.5) * 260 : 0);
    g.bezierCurveTo(x0 - 40 + (r() - 0.5) * sway, H * 0.35, x0 + 40 + (r() - 0.5) * sway, H * 0.65, endX, H * (messy ? 0.82 + r() * 0.12 : 0.93));
    g.stroke();
  }
  g.globalAlpha = 1;
  if (!messy) { // 艶の光
    const sh = g.createLinearGradient(0, H * 0.32, 0, H * 0.46);
    sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.5, 'rgba(255,248,235,.42)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sh; g.fillRect(W * 0.12, H * 0.32, W * 0.76, H * 0.14);
  }
  g.fillStyle = 'rgba(0,0,0,.35)'; g.font = '600 30px sans-serif'; g.textAlign = 'right';
  g.fillText('SAMPLE IMAGE', W - 36, H - 36);
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', 0.9));
}
async function fillSamplePhotos() {
  if (!state.pattern) { openPattern(); return; }
  const btn = document.getElementById('demoPhotos'); btn.disabled = true; btn.textContent = '見本の写真を準備中…';
  try {
    if (state.pattern === 'menu') {
      await onPhoto('p1', await drawSampleHair('caramel'));
      await onPhoto('p2', await drawSampleHair('ash'));
      await onPhoto('p3', await drawSampleHair('pink'));
      const t = document.getElementById('memo-theme'), m = document.getElementById('memo-menu');

      if (m && !m.value) m.value = 'カット＋カラー＋トリートメント';

    }
    toast('見本の写真を入れました');
  } finally { btn.disabled = false; btn.textContent = '📷 見本の写真とメモを入れる'; }
}
